version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: vecai
    main: ./cmd/vecai
    binary: vecai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: vecai
    ids:
      - vecai
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: abdul-hamid-achik
    name: vecai
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

homebrew_casks:
  - name: vecai
    binaries:
      - vecai
    repository:
      owner: abdul-hamid-achik
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/abdul-hamid-achik/vecai"
    description: "AI-powered codebase assistant with semantic search and local LLM intelligence"
    license: "MIT"
    # Released binaries are unsigned (not notarized), so strip the Gatekeeper
    # quarantine attribute on install. GoReleaser <= v2.18 renders this as a
    # legacy `postflight` block; the tap's normalize-casks workflow rewrites it
    # to `postflight_steps`. Switch to `install_steps` once GoReleaser v2.19
    # ships: https://github.com/goreleaser/goreleaser/pull/6873
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vecai"]
          end
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
